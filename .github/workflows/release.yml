name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            group: linux-android
            targets:
              - x86_64-unknown-linux-gnu
              - aarch64-linux-android
              - armv7-linux-androideabi
              - x86_64-linux-android
          - os: ubuntu-24.04-arm
            group: linux-arm64
            targets:
              - aarch64-unknown-linux-gnu
          - os: macos-15
            group: apple
            targets:
              - aarch64-apple-darwin
              - x86_64-apple-darwin
              - aarch64-apple-ios
              - aarch64-apple-ios-sim
              - x86_64-apple-ios
          - os: windows-2025
            group: windows
            targets:
              - x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ join(matrix.targets, ',') }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: ${{ matrix.group }}
      - uses: nttld/setup-ndk@v1
        if: contains(join(matrix.targets, ','), 'android')
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Build release packages
        shell: bash
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          for target in $TARGETS; do
            python tool/build.py --target "$target" --archive
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.group }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
